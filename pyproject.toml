[project]
name = "rl-algorithms-demo"
version = "0.0.7"
description = "An educational demo program to show different RL algorithms inside Sutton's book. Developed with modern Qt UI and providing flexible features to change the environment and agent settings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.1",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.10.1",
    "pyyaml>=6.0.3",
]
